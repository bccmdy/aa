# 🎯 策略分组（表情美化+双智能模式）
proxy-groups:
  - name: "⚡自动优选节点"
    type: url-test
    proxies:
      - "v2ray 台湾(移动) [Netflix]"
      - "v2ray 台湾(联通) [Netflix]"
      - "v2ray 德国(移动) [Netflix]"
      - "v2ray 德国(联通) [Netflix]"
      - "v2ray 新加坡(移动) [Netflix]"
      - "v2ray 新加坡(联通) [Netflix]"
      - "v2ray 日本(移动) [Netflix]"
      - "v2ray 日本(联通) [Netflix]"
      - "v2ray 美国(移动) [Netflix]"
      - "v2ray 美国(联通) [Netflix]"
      - "v2ray 香港(移动) [Netflix]"
      - "v2ray 香港(联通) [Netflix]"
      - "v2ray 香港HGC(移动) [Netflix]"
      - "v2ray 香港HGC(联通) [Netflix]"
      - "v2ray 香港HKT(移动) [Netflix]"
      - "v2ray 香港HKT(联通) [Netflix]"
    url: http://www.gstatic.com/generate_204
    interval: 30
    tolerance: 50

  - name: "🛡️故障备用线路"
    type: fallback
    proxies:
      - "v2ray 台湾(移动) [Netflix]"
      - "v2ray 台湾(联通) [Netflix]"
      - "v2ray 德国(移动) [Netflix]"
      - "v2ray 德国(联通) [Netflix]"
      - "v2ray 新加坡(移动) [Netflix]"
      - "v2ray 新加坡(联通) [Netflix]"
      - "v2ray 日本(移动) [Netflix]"
      - "v2ray 日本(联通) [Netflix]"
      - "v2ray 美国(移动) [Netflix]"
      - "v2ray 美国(联通) [Netflix]"
      - "v2ray 香港(移动) [Netflix]"
      - "v2ray 香港(联通) [Netflix]"
      - "v2ray 香港HGC(移动) [Netflix]"
      - "v2ray 香港HGC(联通) [Netflix]"
      - "v2ray 香港HKT(移动) [Netflix]"
      - "v2ray 香港HKT(联通) [Netflix]"
    url: http://www.gstatic.com/generate_204
    interval: 60

  - name: "🎮手动切换节点"
    type: select
    proxies:
      - "⚡自动优选节点"
      - "🛡️故障备用线路"

  - name: "🌏海外网络通道"
    type: select
    proxies:
      - "⚡自动优选节点"

  - name: "🇨🇳内地直连网络"
    type: select
    proxies:
      - DIRECT

