allow-lan: true
log-level: info
external-controller: 127.0.0.1:9090
mode: rule

# 🔒 安全DNS防污染
dns:
  enable: true
  listen: 0.0.0.0:53
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - 8.8.8.8
    - 1.1.1.1

